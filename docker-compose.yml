services:
  app:
    build: .
    container_name: teachme-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - teachme-data:/data
    # bound to localhost — put a reverse proxy with HTTPS in front (Caddy,
    # nginx, Traefik) rather than exposing the port directly
    ports:
      - '127.0.0.1:3200:3200'
    # deployment-specific extras (reverse-proxy networks, the optional codex
    # engine) go in docker-compose.override.yml — see README

volumes:
  teachme-data:
