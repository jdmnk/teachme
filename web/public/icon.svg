<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="TeachMe">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1c1c21"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <clipPath id="c"><rect width="100" height="100" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="100" height="100" fill="url(#g)"/>
    <!-- the covers' column language, kept faint: the chrome carries no colour,
         so the texture reads as material rather than decoration -->
    <g transform="rotate(-8 50 50)">
      <rect x="-30" y="-30" width="8" height="170" fill="rgba(255,255,255,0.07)"/>
      <rect x="-14" y="-30" width="5" height="170" fill="rgba(255,255,255,0.04)"/>
      <rect x="-3" y="-30" width="12" height="170" fill="rgba(0,0,0,0.30)"/>
      <rect x="15" y="-30" width="6" height="170" fill="rgba(255,255,255,0.07)"/>
      <rect x="27" y="-30" width="9" height="170" fill="rgba(255,255,255,0.04)"/>
      <rect x="42" y="-30" width="5" height="170" fill="rgba(0,0,0,0.30)"/>
      <rect x="53" y="-30" width="11" height="170" fill="rgba(255,255,255,0.07)"/>
      <rect x="70" y="-30" width="7" height="170" fill="rgba(255,255,255,0.04)"/>
      <rect x="83" y="-30" width="10" height="170" fill="rgba(0,0,0,0.30)"/>
      <rect x="99" y="-30" width="6" height="170" fill="rgba(255,255,255,0.07)"/>
      <rect x="111" y="-30" width="9" height="170" fill="rgba(255,255,255,0.04)"/>
    </g>
  </g>
  <path d="M23 26 h54 v16 H59 v34 H41 V42 H23 z" fill="#ffffff"/>
  <!-- keeps the tile from vanishing into a dark tab strip -->
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="21.25" fill="none"
        stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
</svg>
